name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check HTML/CSS structure, assets, labels, and JavaScript syntax
        run: python scripts/check_site.py --require-node
